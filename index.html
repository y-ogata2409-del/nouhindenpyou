<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="納品伝票">
<title>納品伝票スキャン</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #222; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .sel { display: flex; gap: 8px; }
  .sel select, .sel input { flex: 1; font-size: 17px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; min-width: 0; }
  .total { text-align: center; }
  .total .amount { font-size: 32px; font-weight: bold; }
  .total .sub { color: #666; font-size: 13px; }
  .shoot { display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: #fff;
           background: #1a73e8; border: none; border-radius: 12px; text-align: center; box-sizing: border-box; margin-top: 10px; }
  .shoot.secondary { background: #fff; color: #1a73e8; border: 2px solid #1a73e8; }
  .shoot.off { opacity: .4; pointer-events: none; }
  input[type=file] { display: none; }
  #login { position: fixed; inset: 0; z-index: 200; background: #f5f5f5; display: none; overflow-y: auto; padding: 24px 16px; box-sizing: border-box; }
  #login .box { max-width: 420px; margin: 40px auto 0; background: #fff; border-radius: 14px; padding: 22px; }
  #login h2 { margin: 0 0 6px; font-size: 20px; }
  #login p { margin: 4px 0 14px; color: #666; font-size: 14px; }
  #login input { width: 100%; box-sizing: border-box; font-size: 22px; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 10px; }
  #codeIn { text-align: center; letter-spacing: 8px; }
  #login button.main { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; color: #fff; background: #1a73e8; border: none; border-radius: 10px; }
  #login .err { color: #c5221f; font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  #login .link { background: none; border: none; color: #1a73e8; font-size: 14px; margin-top: 14px; padding: 4px; }
  #adminForm { display: none; }
  #adminBox .code { font-size: 44px; font-weight: bold; letter-spacing: 8px; text-align: center; margin: 10px 0 4px; }
  #adminBox .left { text-align: center; color: #666; font-size: 14px; }
  #adminBox #qr { display: flex; justify-content: center; margin: 12px 0; }
  #adminBox input { font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; width: 100%; box-sizing: border-box; margin: 6px 0; }
  #adminBox button { font-size: 15px; padding: 10px 14px; border: 1px solid #ccc; background: #fff; border-radius: 8px; }
  #adminBox button.main { background: #1a73e8; color: #fff; border: none; width: 100%; font-weight: bold; padding: 13px; }
  .dev { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #eee; font-size: 14px; }
  .dev .info { flex: 1; min-width: 0; }
  .dev .sub2 { color: #888; font-size: 12px; }
  .dev .st { font-size: 12px; padding: 2px 8px; border-radius: 8px; background: #fce8e6; color: #c5221f; }
  #authOk { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(19,115,55,.92); color: #fff; animation: authFade 1.9s ease forwards; pointer-events: none; }
  #authOk svg { width: 130px; height: 130px; }
  #authOk circle { fill: none; stroke: #fff; stroke-width: 5; stroke-dasharray: 302; stroke-dashoffset: 302; animation: authDraw .55s ease forwards; }
  #authOk path { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
                 stroke-dasharray: 80; stroke-dashoffset: 80; animation: authDraw .35s .45s ease forwards; }
  #authOk .msg { margin-top: 18px; font-size: 26px; font-weight: bold; animation: authPop .4s .6s ease both; }
  #authOk .sub { margin-top: 6px; font-size: 15px; opacity: .85; animation: authPop .4s .75s ease both; }
  @keyframes authDraw { to { stroke-dashoffset: 0; } }
  @keyframes authPop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  @keyframes authFade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  #cam { display: none; position: fixed; inset: 0; background: #000; z-index: 100; }
  #cam video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #camStat { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
             color: #fff; background: rgba(0,0,0,.5); font-size: 15px; text-align: center; }
  #camMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; pointer-events: none; }
  #lastImg { position: absolute; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); width: 64px; height: 64px;
             object-fit: cover; border-radius: 8px; border: 2px solid #fff; display: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #shutter { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
             width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.35); }
  #shutter:active { background: #fff; }
  #endBtn { position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
            padding: 14px 22px; font-size: 17px; font-weight: bold; color: #fff; background: #d93025; border: none; border-radius: 12px; }
  .prog { position: sticky; top: 8px; z-index: 10; margin-top: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .prog .t { font-weight: bold; text-align: center; }
  .prog .bar { height: 10px; background: #e0e0e0; border-radius: 5px; margin-top: 8px; overflow: hidden; }
  .prog .fill { height: 100%; width: 0; background: #1a73e8; transition: width .3s; }
  .prog.done { background: #e6f4ea; color: #137333; font-size: 18px; }
  .prog.done .bar { display: none; }
  .prog.done.warn { background: #fef7e0; color: #b06000; }
  .item .row { display: flex; align-items: center; gap: 8px; }
  .item .name { font-size: 12px; color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 8px; background: #e6f4ea; color: #137333; white-space: nowrap; }
  .status.warn { background: #fef7e0; color: #b06000; }
  .status.err { background: #fce8e6; color: #c5221f; }
  .edit { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .edit input[type=number] { font-size: 18px; width: 120px; padding: 6px; }
  .edit input[type=date] { font-size: 15px; padding: 6px; }
  .edit button { font-size: 14px; padding: 8px 12px; border: 1px solid #ccc; background: #fff; border-radius: 8px; }
  .edit button.del { color: #c5221f; }
</style>
</head>
<body>
  <div id="login">
    <div class="box">
      <h2>納品伝票スキャン</h2>
      <div id="codeForm">
        <p>管理者から受け取った<b>6桁のコード</b>を入力してください。<br>（QRコードを読み取ると自動で入力されます）</p>
        <input id="codeIn" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
        <div class="err" id="loginErr"></div>
        <button class="main" id="codeBtn">ログイン</button>
        <button class="link" id="toAdmin">管理者としてログイン</button>
      </div>
      <div id="adminForm">
        <p>管理者用の合言葉と、この端末の名前を入力してください。</p>
        <input id="adminPass" type="password" placeholder="合言葉" autocomplete="current-password">
        <input id="adminLabel" type="text" placeholder="この端末の名前（例：管理者iPhone）" value="管理者" style="font-size:16px">
        <div class="err" id="adminErr"></div>
        <button class="main" id="adminBtn">管理者としてログイン</button>
        <button class="link" id="toCode">コードでログインに戻る</button>
      </div>
    </div>
  </div>

  <div class="card sel">
    <select id="vendor"><option value="">問屋を選択</option></select>
    <input type="date" id="date">
  </div>

  <div class="card total">
    <div class="amount" id="total">¥0</div>
    <div class="sub" id="sub">問屋と日付を選んでください</div>
  </div>

  <button class="shoot off" id="b0" onclick="openCam()">📸 連続撮影（アプリ内カメラ）</button>
  <label class="shoot secondary off" id="b1">📷 標準カメラで1枚ずつ撮影
    <input type="file" id="file" accept="image/*" capture="environment" multiple>
  </label>
  <label class="shoot secondary off" id="b2">🖼 撮影済みの写真から選ぶ
    <input type="file" id="gallery" accept="image/*" multiple>
  </label>

  <div id="cam">
    <video id="cv" playsinline autoplay muted></video>
    <div id="camStat"></div>
    <div id="flash"></div>
    <div id="camMsg"></div>
    <img id="lastImg" alt="">
    <button id="shutter" aria-label="撮影" onclick="shoot()" disabled></button>
    <button id="endBtn" onclick="closeCam()">終了</button>
  </div>

  <div id="prog" class="card prog" style="display:none" onclick="if(!running)this.style.display='none'">
    <div class="t" id="progText"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div id="list" style="margin-top:12px"></div>

  <div id="adminBox" class="card" style="display:none; margin-top:24px">
    <div style="font-weight:bold; margin-bottom:6px">🔑 管理者メニュー</div>
    <input id="devLabel" type="text" maxlength="30" placeholder="追加する端末の名前（例：受付iPhone）">
    <button class="main" id="issueBtn">ログインコードを発行</button>
    <div id="codeOut" style="display:none">
      <div class="code" id="codeBig"></div>
      <div class="left" id="codeLeft"></div>
      <div id="qr"></div>
    </div>
    <div style="margin-top:16px; display:flex; align-items:center; justify-content:space-between">
      <b style="font-size:14px">登録済みの端末</b><button id="devReload">更新</button>
    </div>
    <div id="devList"></div>
  </div>

<script>
  const MAX_SIDE = 2000, QUALITY = 0.85;
  const $ = id => document.getElementById(id);
  const fmt = n => '¥' + Number(n).toLocaleString('ja-JP');
  const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };

  $('date').value = today();

  // ★ GASをデプロイして発行された「ウェブアプリのURL」(/exec で終わるもの)をここに貼る
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwxseSfBxv7Wuv_KtLYq10JYGoOyOvQ0EaUMWw2lkUlI4k97Zg7YtuopedpPHSiC1La/exec';

  // ---- 端末の登録とログイン ----
  const TOKEN_KEY = 'nouhin_token';
  let me = null, vendorsLoaded = false;

  const getToken = () => { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } };
  const setToken = t => { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} };
  const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

  function showAuthOk() {
    const d = document.createElement('div');
    d.id = 'authOk';
    d.innerHTML = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/><path d="M28 52 L44 68 L73 34"/></svg>' +
                  '<div class="msg">認証OK</div><div class="sub">ようこそ</div>';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1900);
    try {   // 上がっていく2音のチャイム（消音スイッチがオンの間は鳴りません）
      const C = window.AudioContext || window.webkitAudioContext;
      const ctx = new C();
      if (ctx.state === 'suspended') ctx.resume();
      [[660, 0], [880, 0.14]].forEach(([f, t]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.35);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.4);
      });
    } catch (e) {}
  }

  // GASを呼ぶ。Content-Typeは指定しない（指定すると事前確認が走ってGASが受け付けない）
  async function call(fn, args, withToken) {
    let res;
    try {
      res = await fetch(GAS_URL, { method: 'POST',
        body: JSON.stringify({ token: withToken ? getToken() : undefined, fn: fn, args: args }) });
    } catch (e) {
      throw new Error('通信できませんでした（電波・URLを確認してください）');
    }
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('サーバーの応答を読み取れません（GASのURLとアクセス設定を確認）'); }
    if (!j.ok) {
      if (j.error === 'AUTH' && withToken) { clearToken(); me = null; showLogin(''); throw new Error('ログインが無効になりました。もう一度ログインしてください'); }
      throw new Error(j.error);
    }
    return j.data;
  }
  const run = (fn, ...args) => call(fn, args, true);

  function showLogin(msg) {
    $('login').style.display = 'block';
    $('loginErr').textContent = msg || '';
  }

  function onLoggedIn(dev, fresh) {
    me = dev;
    $('login').style.display = 'none';
    $('adminBox').style.display = dev.role === 'admin' ? 'block' : 'none';
    if (fresh) showAuthOk();
    if (!vendorsLoaded) {
      vendorsLoaded = true;
      run('getVendors').then(list => {
        list.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; $('vendor').appendChild(o); });
      }).catch(() => { vendorsLoaded = false; });
    }
    refresh();
    if (dev.role === 'admin') loadDevices();
  }

  async function doCodeLogin(code) {
    $('loginErr').textContent = '';
    try {
      const r = await call('login', [code], false);
      setToken(r.token);
      onLoggedIn({ id: r.id, label: r.label, role: r.role }, true);
    } catch (e) { $('loginErr').textContent = e.message; }
  }

  $('codeBtn').onclick = () => doCodeLogin($('codeIn').value.trim());
  $('codeIn').oninput = () => { if ($('codeIn').value.trim().length === 6) doCodeLogin($('codeIn').value.trim()); };
  $('toAdmin').onclick = () => { $('codeForm').style.display = 'none'; $('adminForm').style.display = 'block'; };
  $('toCode').onclick = () => { $('adminForm').style.display = 'none'; $('codeForm').style.display = 'block'; };
  $('adminBtn').onclick = async () => {
    $('adminErr').textContent = '';
    try {
      const r = await call('adminLogin', [$('adminPass').value, $('adminLabel').value], false);
      $('adminPass').value = '';
      setToken(r.token);
      onLoggedIn({ id: r.id, label: r.label, role: r.role }, true);
    } catch (e) { $('adminErr').textContent = e.message === 'AUTH' ? '合言葉が違います' : e.message; }
  };

  // ---- 管理者メニュー ----
  let codeTimer = null;

  $('issueBtn').onclick = async () => {
    try {
      const r = await run('issueCode', $('devLabel').value.trim());
      $('codeBig').textContent = r.code;
      $('codeOut').style.display = 'block';
      $('qr').innerHTML = '';
      const url = location.origin + location.pathname + '#c=' + r.code;
      if (typeof QRCode !== 'undefined') new QRCode($('qr'), { text: url, width: 200, height: 200 });
      let left = r.ttl;
      clearInterval(codeTimer);
      const tick = () => {
        if (left <= 0) {
          clearInterval(codeTimer);
          $('codeLeft').textContent = '有効期限が切れました。もう一度発行してください';
          $('codeBig').style.opacity = 0.25; $('qr').style.opacity = 0.25;
          return;
        }
        $('codeBig').style.opacity = 1; $('qr').style.opacity = 1;
        $('codeLeft').textContent = '残り ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + '（1回だけ使えます）';
        left--;
      };
      tick(); codeTimer = setInterval(tick, 1000);
      $('devLabel').value = '';
    } catch (e) { alert(e.message); }
  };

  async function loadDevices() {
    try {
      const list = await run('listDevices');
      const box = $('devList');
      box.innerHTML = '';
      list.forEach(d => {
        const row = document.createElement('div'); row.className = 'dev';
        const info = document.createElement('div'); info.className = 'info';
        const t = document.createElement('div');
        t.textContent = d.label + (d.role === 'admin' ? '（管理者）' : '') + (me && d.id === me.id ? '　← この端末' : '');
        const s = document.createElement('div'); s.className = 'sub2';
        s.textContent = '最終使用 ' + d.lastUsed;
        info.appendChild(t); info.appendChild(s); row.appendChild(info);
        if (d.status === '有効') {
          if (!(me && d.id === me.id)) {
            const b = document.createElement('button'); b.textContent = '無効にする';
            b.onclick = async () => {
              if (!confirm('「' + d.label + '」を無効にしますか？\nこの端末は、次の操作でログイン画面に戻ります。')) return;
              try { await run('revokeDevice', d.id); loadDevices(); } catch (e) { alert(e.message); }
            };
            row.appendChild(b);
          }
        } else {
          const st = document.createElement('span'); st.className = 'st'; st.textContent = d.status; row.appendChild(st);
        }
        box.appendChild(row);
      });
    } catch (e) { $('devList').textContent = e.message; }
  }
  $('devReload').onclick = loadDevices;

  // ---- 起動時 ----
  (async function start() {
    const m = location.hash.match(/c=(\d{6})/);
    if (m) history.replaceState(null, '', location.pathname + location.search);   // QRのコードをURLから消す
    if (getToken()) {
      try { onLoggedIn(await call('whoami', [], true), false); return; }
      catch (e) { if (!$('login').style.display || $('login').style.display === 'none') showLogin(e.message); return; }
    }
    showLogin('');
    if (m) doCodeLogin(m[1]);
  })();

  function ready() {
    const ok = $('vendor').value && $('date').value;
    $('b0').classList.toggle('off', !ok);
    $('b1').classList.toggle('off', !ok);
    $('b2').classList.toggle('off', !ok);
    return ok;
  }

  async function refresh() {
    if (!ready()) { $('total').textContent = '¥0'; $('sub').textContent = '問屋と日付を選んでください'; return; }
    renderSummary(await run('getSummary', $('vendor').value, $('date').value));
  }
  function renderSummary(s) {
    $('total').textContent = fmt(s.total);
    $('sub').textContent = $('vendor').value + ' ' + $('date').value + '：' + s.count + '枚　／　全体合計 ' + fmt(s.grand);
  }
  $('vendor').onchange = refresh;
  $('date').onchange = refresh;

  // ---- 処理キュー（進捗表示と完了の合図） ----
  const queue = [];
  let running = false;
  let stat = { total: 0, done: 0, warn: 0 };
  let audioCtx = null;

  function unlockAudio() {   // iPhoneは操作中に一度音を有効化しておく必要がある
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      audioCtx = audioCtx || new C();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function beep() {
    try {
      [0, 0.18].forEach(t => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; g.gain.value = 0.25;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.12);
      });
    } catch (e) {}
  }

  function showProgress() {
    const p = $('prog');
    p.style.display = 'block';
    p.className = 'card prog';
    $('progText').textContent = '処理中 ' + stat.done + ' / ' + stat.total + ' 枚　（画面を閉じないでください）';
    $('fill').style.width = (stat.total ? stat.done / stat.total * 100 : 0) + '%';
    document.title = '処理中 ' + stat.done + '/' + stat.total;
    updateCamStat();
  }
  function showDone() {
    const p = $('prog');
    p.className = 'card prog done' + (stat.warn ? ' warn' : '');
    $('progText').textContent = '✅ 完了！ ' + stat.total + '枚を処理しました' +
      (stat.warn ? '（要確認・失敗 ' + stat.warn + '枚）' : '');
    document.title = '完了';
    beep();
  }

  async function work() {
    running = true;
    do {
      while (queue.length) {
        const t = queue.shift();
        const status = await handleFile(t.f, t.vendor, t.date);
        stat.done++;
        if (status !== 'OK' && status !== '手修正') stat.warn++;
        showProgress();
      }
      await refresh();
    } while (queue.length);   // 待っている間に撮影された分があれば続ける
    running = false;
    showDone();
  }

  function enqueue(items) {
    unlockAudio();
    if (!running) stat = { total: 0, done: 0, warn: 0 };
    items.forEach(i => queue.push(i));
    stat.total += items.length;
    showProgress();
    if (!running) work();
  }

  ['file', 'gallery'].forEach(id => {
    $(id).addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      e.target.value = '';
      if (!files.length) return;
      const vendor = $('vendor').value, date = $('date').value;   // 選択時点の指定を使う
      enqueue(files.map(f => ({ f: f, vendor: vendor, date: date })));
    });
  });

  // ---- アプリ内カメラ（連続撮影） ----
  let camStream = null, shots = 0, camCtx = { vendor: '', date: '' };

  function updateCamStatForce() {
    $('camStat').textContent = camCtx.vendor + '　' + camCtx.date + '　撮影 ' + shots + '枚 ／ 処理済 ' + stat.done + '枚';
  }
  function updateCamStat() {
    if ($('cam').style.display !== 'block') return;
    $('camStat').textContent = camCtx.vendor + '　' + camCtx.date + '　撮影 ' + shots + '枚 ／ 処理済 ' + stat.done + '枚';
  }

  let camToken = 0;

  function camErrText(err) {
    const n = err && err.name;
    if (n === 'NotAllowedError' || n === 'SecurityError')
      return 'カメラの使用が許可されていません。\n\n【iPhoneの確認方法】\nSafariのアドレスバー左の「ぁあ」→「Webサイトの設定」→「カメラ」を「許可」にして、ページを再読み込みしてください。\n\n' + n;
    if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'カメラが見つかりません。\n' + n;
    return 'カメラを起動できません。\n' + (n || '') + ' ' + ((err && err.message) || err);
  }

  function openCam() {
    if (!ready()) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('この環境ではアプリ内カメラを使えません。「標準カメラで1枚ずつ撮影」をご利用ください。');
      return;
    }
    // ボタンを押した直後に最優先でカメラを要求する（許可の確認は、操作の流れの中で出す必要がある）
    const req = navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
    unlockAudio();

    const my = ++camToken;
    shots = 0;
    camCtx = { vendor: $('vendor').value, date: $('date').value };
    $('lastImg').style.display = 'none';
    $('shutter').disabled = true;
    $('camMsg').textContent = 'カメラを起動しています…';
    $('cam').style.display = 'block';
    updateCamStatForce();

    req.then(stream => {
      if (my !== camToken) { stream.getTracks().forEach(t => t.stop()); return; }   // 起動待ち中に終了された
      camStream = stream;
      const v = $('cv');
      v.srcObject = stream;
      return v.play();
    }).then(() => {
      if (my !== camToken) return;
      $('camMsg').textContent = '';
      $('shutter').disabled = false;
      updateCamStat();
    }).catch(err => {
      if (my !== camToken) return;
      closeCam();
      alert(camErrText(err) + '\n\n「標準カメラで1枚ずつ撮影」も使えます。');
    });
  }

  function closeCam() {
    camToken++;
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    $('cv').srcObject = null;
    $('cam').style.display = 'none';
  }

  function shoot() {
    const v = $('cv');
    if (!camStream || !v.videoWidth) return;
    const k = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * k);
    c.height = Math.round(v.videoHeight * k);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', QUALITY);

    shots++;
    const li = $('lastImg'); li.src = url; li.style.display = 'block';
    const f = $('flash');                       // 撮れたことが分かる一瞬の点滅
    f.style.transition = 'none'; f.style.opacity = 0.8;
    requestAnimationFrame(() => { f.style.transition = 'opacity .25s'; f.style.opacity = 0; });

    enqueue([{ f: url, vendor: camCtx.vendor, date: camCtx.date }]);   // 保存・OCRを待たずに次を撮れる
    updateCamStat();
  }

  async function handleFile(file, vendor, date) {
    const item = document.createElement('div');
    item.className = 'card item';
    item.innerHTML = '<div class="row"><span class="name">アップロード中…</span></div>';
    $('list').prepend(item);
    try {
      const res = await run('uploadAndOcr', typeof file === 'string' ? file : await resize(file), vendor, date);
      renderItem(item, res);
      return res.status;
    } catch (err) {
      item.innerHTML = '<div class="row"><span class="status err">失敗</span><span class="name">' + (err.message || err) + '</span></div>';
      return '失敗';
    }
  }

  function renderItem(item, res) {
    const cls = res.status === 'OK' || res.status === '手修正' ? '' : res.status.startsWith('要確認') ? 'warn' : 'err';
    item.innerHTML =
      '<div class="row"><span class="status ' + cls + '">' + res.status + '</span>' +
      '<span class="name">' + res.vendor + '　' + res.name + '</span></div>' +
      '<div class="edit">¥<input type="number" inputmode="numeric" class="amt" value="' + (res.amount === '' ? '' : res.amount) + '">' +
      '<input type="date" class="dt" value="' + res.date + '">' +
      '<button class="save">保存</button><button class="del">削除</button></div>';

    item.querySelector('.save').onclick = async () => {
      const amt = item.querySelector('.amt').value, dt = item.querySelector('.dt').value;
      try {
        const s = await run('updateEntry', res.id, amt, dt);
        const changed = String(amt) !== String(res.amount);
        renderItem(item, Object.assign(res, { amount: amt === '' ? '' : Number(amt), date: dt, status: changed ? '手修正' : res.status }));
        refresh();
      } catch (err) { alert(err.message || err); }
    };
    item.querySelector('.del').onclick = async () => {
      if (!confirm('この伝票を削除しますか？')) return;
      try { await run('deleteEntry', res.id); item.remove(); refresh(); }
      catch (err) { alert(err.message || err); }
    };
  }

  function resize(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', QUALITY));
      };
      img.onerror = () => reject(new Error('画像を読み込めません'));
      img.src = url;
    });
  }
</script>
</body>
</html>
